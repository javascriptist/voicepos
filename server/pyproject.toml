[project]
name = "voicepos"
version = "0.1.0"
description = "Voice POS server: speech to validated order JSON"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "mlx-audio>=0.2",
    "mlx-lm>=0.28",
    "pydantic>=2.9",
    "rapidfuzz>=3.10",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test cases are data tables; one case per line reads better than wrapped literals.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
